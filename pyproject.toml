[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "curatormd-v2"
version = "0.1.0a1"
description = "Goal-ledger CuratorMD V2 core"
requires-python = ">=3.12,<4"
dependencies = ["mcp>=2,<3"]

[project.scripts]
curatormd-v2-mcp = "curatormd_v2.hosted_mcp:main"
curatormd-v2-stage = "curatormd_v2.producer_cli:main"
curatormd-v2-maintenance = "curatormd_v2.maintenance_cli:main"
curatormd-v2-access = "curatormd_v2.access_cli:main"

[dependency-groups]
test = ["hypothesis>=6.135,<7", "jsonschema>=4.26,<5"]
quality = [
    "bandit==1.9.4",
    "pylint==4.1.3",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pylint.basic]
# Descriptive test names are the test documentation; avoid redundant docstrings.
no-docstring-rgx = "^(?:_|test_)"
