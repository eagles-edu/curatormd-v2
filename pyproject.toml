[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "curatormd-v2"
version = "0.1.0"
description = "Goal-ledger CuratorMD backend (initial scaffold)"
requires-python = ">=3.12,<4"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
