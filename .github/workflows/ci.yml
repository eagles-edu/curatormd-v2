name: Curator V2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curator-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-install:
    name: Build and exercise the installed wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Build wheel
        run: uv build --out-dir "$RUNNER_TEMP/curator-v2-dist"
      - name: Install wheel into a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/curator-v2-wheel-venv"
          uv pip install \
            --python "$RUNNER_TEMP/curator-v2-wheel-venv/bin/python" \
            "$RUNNER_TEMP/curator-v2-dist"/*.whl
      - name: Exercise the installed consumer-bound MCP launcher
        run: |
          cd tests
          env -u PYTHONPATH \
            "$RUNNER_TEMP/curator-v2-wheel-venv/bin/python" \
            -m unittest \
            test_hosted_mcp.HostedMcpTests.test_installed_launcher_writes_and_reads_a_project_bound_goal \
            -v

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --group test
      - name: Run tests
        run: uv run --locked --group test python -m unittest discover -s tests -v

  quality-and-security:
    name: Type, lint, and dependency security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Install locked quality tools
        run: uv sync --locked --python 3.12 --group test --group quality
      - name: Run strict type checking
        run: uv run --locked --group quality pyright
      - name: Run blocking Pylint errors
        run: uv run --locked --group quality pylint --errors-only src/curatormd_v2 tests
      - name: Scan source for common security issues
        run: uv run --locked --group quality bandit -q -r src/curatormd_v2
      - name: Audit all locked dependencies and project statuses
        run: uv audit --locked --preview-features audit-command
