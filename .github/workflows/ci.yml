name: Curator V2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curator-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-install:
    name: Build and exercise the installed wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Build wheel
        run: uv build --out-dir "$RUNNER_TEMP/curator-v2-dist"
      - name: Install wheel into a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/curator-v2-wheel-venv"
          uv pip install \
            --python "$RUNNER_TEMP/curator-v2-wheel-venv/bin/python" \
            "$RUNNER_TEMP/curator-v2-dist"/*.whl
      - name: Exercise the installed consumer-bound MCP launcher
        run: |
          cd tests
          env -u PYTHONPATH \
            "$RUNNER_TEMP/curator-v2-wheel-venv/bin/python" \
            -m unittest \
            test_hosted_mcp.HostedMcpTests.test_installed_launcher_writes_and_reads_a_project_bound_goal \
            test_hosted_mcp.HostedMcpTests.test_installed_launcher_exposes_sde_proposal_context \
            -v
      - name: Exercise installed operational command entrypoints
        env:
          CURATOR_V2_SMOKE_DIR: ${{ runner.temp }}/curator-v2-storage-smoke
        run: |
          install -d -m 700 "$CURATOR_V2_SMOKE_DIR/backups" "$CURATOR_V2_SMOKE_DIR/recovery"
          wheel_python="$RUNNER_TEMP/curator-v2-wheel-venv/bin/python"
          wheel_bin="$RUNNER_TEMP/curator-v2-wheel-venv/bin"
          "$wheel_bin/curatormd-v2-stage" --help >/dev/null
          "$wheel_bin/curatormd-v2-maintenance" --help >/dev/null
          "$wheel_bin/curatormd-v2-access" --help >/dev/null
          "$wheel_bin/curatormd-v2-review" --help >/dev/null
          "$wheel_bin/curatormd-v2-router" --help >/dev/null
          "$wheel_bin/curatormd-v2-storage" --help >/dev/null
          "$wheel_python" - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          root = Path(os.environ["CURATOR_V2_SMOKE_DIR"])
          source = root / "source.sqlite3"
          with sqlite3.connect(source) as database:
              database.execute("CREATE TABLE wheel_smoke (value TEXT NOT NULL)")
              database.execute("INSERT INTO wheel_smoke VALUES ('round-trip-ok')")
          source.chmod(0o600)
          PY
          "$wheel_bin/curatormd-v2-storage" backup \
            --database "$CURATOR_V2_SMOKE_DIR/source.sqlite3" \
            --destination "$CURATOR_V2_SMOKE_DIR/backups/snapshot.sqlite3"
          "$wheel_bin/curatormd-v2-storage" restore \
            --backup "$CURATOR_V2_SMOKE_DIR/backups/snapshot.sqlite3" \
            --destination "$CURATOR_V2_SMOKE_DIR/recovery/restored.sqlite3" \
            --restore-to-new-path
          "$wheel_python" - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          restored = Path(os.environ["CURATOR_V2_SMOKE_DIR"]) / "recovery/restored.sqlite3"
          with sqlite3.connect(f"file:{restored}?mode=ro", uri=True) as database:
              assert database.execute("PRAGMA quick_check").fetchone() == ("ok",)
              assert (
                  database.execute("SELECT value FROM wheel_smoke").fetchone()
                  == ("round-trip-ok",)
              )
          PY

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --group test
      - name: Run tests
        run: uv run --locked --group test python -m unittest discover -s tests -v

  quality-and-security:
    name: Type, lint, and dependency security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.18
          enable-cache: true
      - name: Install locked quality tools
        run: uv sync --locked --python 3.12 --group test --group quality
      - name: Run strict type checking
        run: uv run --locked --group quality pyright
      - name: Run blocking Pylint errors
        run: uv run --locked --group quality pylint --errors-only src/curatormd_v2 tests
      - name: Scan source for common security issues
        run: uv run --locked --group quality bandit -q -r src/curatormd_v2
      - name: Audit all locked dependencies and project statuses
        run: uv audit --locked --preview-features audit-command
